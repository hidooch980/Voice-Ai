name: Standalone Android APK

on:
  push:
    paths: ['apps/android/**', '.github/workflows/android-standalone.yml']
  pull_request:
    paths: ['apps/android/**', '.github/workflows/android-standalone.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test build overlay
        run: python3 -m unittest discover -s apps/android/tests -v
      - name: Fetch pinned Android source
        run: |
          mkdir -p work
          git clone --no-checkout https://github.com/2dust/v2rayNG.git work/android
          REVISION=$(python3 -c 'import json; print(json.load(open("apps/android/upstream.lock.json"))["commit"])')
          git -C work/android checkout --detach "$REVISION"
          git -C work/android submodule update --init --recursive
          python3 apps/android/prepare.py work/android
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools ndk;30.0.16248370'
          log-accepted-android-sdk-licenses: false
      - name: Build and test installable preview APKs
        run: bash apps/android/build.sh "$PWD/work/android" debug
      - name: Verify packaged native engines and MLH identity
        run: |
          python3 apps/android/verify_apks.py work/android/V2rayNG/app/build/outputs/apk/fdroid/debug
          for apk in work/android/V2rayNG/app/build/outputs/apk/fdroid/debug/*.apk; do
            "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
            grep -F "package: name='io.github.hidooch980.mlhvpn.fdroid'" "$RUNNER_TEMP/badging.txt"
            grep -F "application-label:'MLH VPN'" "$RUNNER_TEMP/badging.txt"
          done
      - name: Bundle source and checksums
        run: |
          mkdir -p dist
          cp work/android/V2rayNG/app/build/outputs/apk/fdroid/debug/*.apk dist/
          cp work/android/V2rayNG/app/build/outputs/apk/androidTest/fdroid/debug/*.apk dist/MLHVPN-androidTest.apk
          cp apps/android/INSTALL.fa.md dist/
          cp apps/android/upstream.lock.json dist/
          tar --exclude=.git --exclude=.gradle --exclude=build --exclude=libs --exclude=local.properties \
            -czf dist/MLHVPN-android-source.tar.gz apps/android work/android
          cd dist
          sha256sum *.apk MLHVPN-android-source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MLHVPN-Android-preview
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Android-test-results
          path: work/android/V2rayNG/app/build/reports/tests/
          if-no-files-found: ignore

  android-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: MLHVPN-Android-preview
          path: preview
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install preview/MLHVPN_*-fdroid_x86_64.apk
            adb install preview/MLHVPN-androidTest.apk
            adb shell pm grant io.github.hidooch980.mlhvpn.fdroid android.permission.POST_NOTIFICATIONS
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am instrument -w io.github.hidooch980.mlhvpn.fdroid.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            grep -F 'OK (1 test)' instrumentation.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Android-smoke-results
          path: instrumentation.txt
          if-no-files-found: ignore
