name: Verify and publish signed Android
on:
  push:
    branches: ['codex/android-0.5']
    paths: ['release-signatures/0.5.0/**', '.github/workflows/android-publish.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: mlh-publish-0.5.0
  cancel-in-progress: false
jobs:
  verify:
    if: startsWith(github.event.head_commit.message, 'publish:')
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.manifest.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate pinned build manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, re, os, subprocess
          m = json.load(open('release-signatures/0.5.0/manifest.json'))
          assert isinstance(m['run_id'], int) and m['run_id'] > 0
          assert re.fullmatch('[a-f0-9]{40}', m['source_sha'])
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{m["run_id"]}']))
          assert run['head_sha'] == m['source_sha'] and run['conclusion'] == 'success'
          assert run['name'] == 'Android release candidate' and run['head_branch'] == 'codex/android-0.5'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'run={m["run_id"]}\nsource={m["source_sha"]}\n')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: MLHVPN-unsigned
          path: unsigned
          run-id: ${{ steps.manifest.outputs.run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: MLHVPN-source
          path: source
          run-id: ${{ steps.manifest.outputs.run }}
          github-token: ${{ github.token }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '14742923'
          packages: 'build-tools;37.0.0 platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Reconstruct and verify exact APK signatures
        run: |
          set -euo pipefail
          mkdir -p dist test-apk
          for apk in unsigned/*.apk; do
            name=$(basename "$apk")
            target="dist/$name"
            if [ "$name" = MLHVPN-androidTest.apk ]; then target="test-apk/$name"; fi
            python3 apps/android/apk_signature_patch.py apply "$apk" "release-signatures/0.5.0/$name.json" "$target"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$target" > "$RUNNER_TEMP/signature.txt"
            grep -F 'certificate SHA-256 digest: 3c8849fc59084133e7b09402ee1665563f5329ce3602380a7e05faee8d4e7d7d' "$RUNNER_TEMP/signature.txt"
            "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 "$target"
          done
          test "$(find dist -name '*.apk' | wc -l)" -eq 3
          python3 apps/android/verify_apks.py dist
          for apk in dist/*.apk; do
            "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
            grep -F "package: name='io.github.hidooch980.mlhvpn.fdroid'" "$RUNNER_TEMP/badging.txt"
            if grep -Fq 'application-debuggable' "$RUNNER_TEMP/badging.txt"; then exit 1; fi
          done
          cp source/MLHVPN-android-source.tar.gz dist/
          cp apps/android/RELEASE-NOTES.fa.md apps/android/INSTALL.fa.md dist/
          cp release-signatures/0.5.0/MLHVPN-signing-cert.pem dist/
          cd dist
          sha256sum *.apk *.pem *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MLHVPN-verified-release
          path: dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MLHVPN-verified-test
          path: test-apk/
  smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: MLHVPN-verified-release
          path: release
      - name: Download previous signed release and enable KVM
        run: |
          curl -fL --retry 3 https://github.com/hidooch980/MLH-VPN/releases/download/v0.4.0/MLHVPN_0.4.0-fdroid_universal.apk -o previous.apk
          echo 'a7d6502b13dfc56652ac1737900d28dc559744266cf9cfe957acf04c49f8db37  previous.apk' | sha256sum -c
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install previous.apk
            adb install -r release/MLHVPN_0.5.0-fdroid_universal.apk
            adb shell pm grant io.github.hidooch980.mlhvpn.fdroid android.permission.POST_NOTIFICATIONS
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell dumpsys package io.github.hidooch980.mlhvpn.fdroid | tee package.txt
            grep -F 'versionName=0.5.0' package.txt
            adb shell am start -W -n io.github.hidooch980.mlhvpn.fdroid/com.v2ray.ang.ui.main.MainActivity | tee launch.txt
            grep -F 'Status: ok' launch.txt
            sleep 3
            adb shell dumpsys activity activities | grep -F 'mResumedActivity' | grep -F 'io.github.hidooch980.mlhvpn.fdroid'
            adb exec-out screencap -p > dashboard.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Signed-upgrade-smoke
          path: |
            package.txt
            launch.txt
            dashboard.png
  publish:
    needs: [verify, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: MLHVPN-verified-release
          path: release
      - name: Publish three verified installation packages
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.verify.outputs.source }}
        run: |
          cd release
          sha256sum -c SHA256SUMS
          gh release create v0.5.0 --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title 'MLH VPN 0.5.0' --notes-file RELEASE-NOTES.fa.md ./*.apk ./MLHVPN-signing-cert.pem ./MLHVPN-android-source.tar.gz ./SHA256SUMS ./INSTALL.fa.md
